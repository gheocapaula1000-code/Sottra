name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Publishable Vite placeholders only — never Stripe/Core secrets.
      # Lovable keeps a local `.env` (expected). CI checkouts have none, so tests
      # get these dummies. Real repo secrets for VITE_* would override if set.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      VITE_SUPABASE_PROJECT_ID: test-project-id
      VITE_USE_MOCK: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Verify secrets
        run: npm run verify:secrets

      - name: Build
        run: npm run build

      - name: Verify package
        run: bash scripts/verify-package.sh
