version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      testing:
        patterns: ["vitest", "@testing-library/*", "jsdom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
